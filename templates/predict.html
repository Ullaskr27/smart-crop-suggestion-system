
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Crop Prediction Form</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <style>
        body {
            background-color: #f4f9f4;
        }

        .form-container {
            max-width: 750px;
            margin: 50px auto;
            padding: 30px;
            background: white;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
        }

        h2 {
            color: #14532d;
            font-weight: bold;
        }

        .btn-green {
            background-color: #14532d;
            color: white;
        }

        .btn-green:hover {
            background-color: #166534;
            color: white;
        }
    </style>
</head>

<body>

<div class="container">
    <div class="form-container">

        <h2 class="text-center mb-3">🌱 Crop Recommendation</h2>

        <p class="text-center text-muted">
            Enter your soil and weather details
        </p>

        
<form action="/predict" method="POST">

    <div class="row">

        <div class="col-md-6 mb-3">
            <label class="form-label">Nitrogen (N)</label>
            <input type="number" name="nitrogen"
                   class="form-control" placeholder="Enter nitrogen value"
                   required>
        </div>

        <div class="col-md-6 mb-3">
            <label class="form-label">Phosphorus (P)</label>
            <input type="number" name="phosphorus"
                   class="form-control" placeholder="Enter phosphorus value"
                   required>
        </div>

        <div class="col-md-6 mb-3">
            <label class="form-label">Potassium (K)</label>
            <input type="number" name="potassium"
                   class="form-control" placeholder="Enter potassium value"
                   required>
        </div>

        <div class="col-md-6 mb-3">
            <label class="form-label">Soil pH</label>
            <input type="number" name="ph" step="0.1"
                   class="form-control" placeholder="Example: 6.5"
                   required>
        </div>

        <div class="col-md-6 mb-3">
            <label class="form-label">Temperature (°C)</label>
            <input type="number" name="temperature" step="0.1"
                   class="form-control" placeholder="Enter temperature"
                   required>
        </div>

        <div class="col-md-6 mb-3">
            <label class="form-label">Humidity (%)</label>
            <input type="number" name="humidity" step="0.1"
                   class="form-control" placeholder="Enter humidity"
                   required>
        </div>

        <div class="col-md-6 mb-3">
            <label class="form-label">Rainfall (mm)</label>
            <input type="number" name="rainfall" step="0.1"
                   class="form-control" placeholder="Enter rainfall"
                   required>
        </div>

    </div>

    <button type="submit" class="btn btn-green w-100 mt-3">
        Get Crop Recommendation
    </button>

</form>


    </div>
</div>

</body>
</html>
